services:
  warehouse:
    image: postgres:15
    container_name: energy_warehouse_pg
    environment:
      POSTGRES_DB: energy
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
    ports:
      - "5435:5432"
    volumes:
      - energy_pg:/var/lib/postgresql/data
      - ./data/fuel_prices_public_sample.csv:/data/fuel_prices.csv:ro
      - ./sql/00_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./scripts/docker_load.sh:/docker-entrypoint-initdb.d/01_load.sh:ro

volumes:
  energy_pg:
